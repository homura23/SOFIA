seed: 42
device: auto

data:
  train_csv: data/train.csv
  val_csv: data/valid.csv
  base_sample_rate: 44100
  segment_seconds: 0
  normalize: true
  mono: false
  random_crop: true
  batch_size: 8
  num_workers: 2

training:
  epochs: 10
  lr: 0.001
  weight_decay: 0.0001
  betas: [0.9, 0.98]
  max_grad_norm: 5.0
  amp: false
  freeze_encoders: true
  log_interval: 20
  save_dir: outputs
  save_every: 1
  num_classes: 2
  warmup_softmax_epochs: 0
  warmup_lr: 0.001
  warmup_amp: false

fusion:
  projector_dim: 256
  fusion_hidden: [512]
  fusion_out: 256
  dropout: 0.1
  l2_norm: true
  mode: moe  # concat, model_gating, feature_gating, moe

loss:
  type: softmax

audio_branches:
  fxpp:
    enabled: true
    weights: third_party/fxencoder_plusplus/fxenc_plusplus_default.pt
    repo_path: third_party/fxencoder_plusplus
    target_sr: 44100
    channels: 2
    segment_seconds: 0
    embed_dim: 128
    project_dim: 256
    device: auto
  muq:
    enabled: true
    weights: third_party/muq_weights
    repo_path: third_party/muq
    target_sr: 24000
    channels: 1
    segment_seconds: 0
    embed_dim: 1024
    project_dim: 256
    device: auto
  mert:
    enabled: true
    weights: third_party/mert
    target_sr: 24000
    channels: 1
    segment_seconds: 0
    embed_dim: 768
    project_dim: 256
    layer_pooling: layer_mean  # layer_mean or last_layer
    device: auto
  rawnet:
    enabled: true
    config: third_party/rawnet/model_config_RawNet.yaml
    weights: third_party/rawnet/epoch_49.pth
    target_sr: 16000
    channels: 1
    segment_seconds: 0
    embed_dim: 1024
    project_dim: 256
    repo_path: third_party/rawnet
    device: auto
    use_vocals: true
